# Cloudflare Workers config for the Index Agentica MCP server.
name = "indexagentica-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Free *.workers.dev URL: https://indexagentica-mcp.<account-subdomain>.workers.dev
workers_dev = true

# --- Custom domain (requires the indexagentica.com zone to be ON Cloudflare) ---
# Uncomment once the zone is active on Cloudflare. Wrangler then creates the
# DNS record + certificate for mcp.indexagentica.com automatically.
# routes = [
#   { pattern = "mcp.indexagentica.com", custom_domain = true }
# ]

[vars]
DATA_BASE_URL = "https://indexagentica.com"
CACHE_TTL_SECONDS = "600"
# Documented limit; must match [ratelimits.simple] below.
RATE_LIMIT_REQUESTS = "120"
RATE_LIMIT_PERIOD_SECONDS = "60"
ALLOWED_ORIGINS = "*"
# Set to the public URL once deployed so links in GET / are canonical, e.g.
# PUBLIC_BASE_URL = "https://mcp.indexagentica.com"

# Workers Rate Limiting binding (per key, per Cloudflare location).
# namespace_id is any positive integer unique within the Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 120
  period = 60

[observability]
enabled = true

# Low-limit environment used only by the automated rate-limit test:
#   npx wrangler dev --env ratelimit-test --port 8788
[env.ratelimit-test]
[env.ratelimit-test.vars]
DATA_BASE_URL = "https://indexagentica.com"
CACHE_TTL_SECONDS = "600"
RATE_LIMIT_REQUESTS = "5"
RATE_LIMIT_PERIOD_SECONDS = "10"
ALLOWED_ORIGINS = "*"
[[env.ratelimit-test.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4299"
  [env.ratelimit-test.ratelimits.simple]
  limit = 5
  period = 10
