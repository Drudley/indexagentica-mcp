# Cloudflare Workers config for the Index Agentica MCP server.
name = "indexagentica-mcp"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "ab100e144ef0d4c54ae8e2d4e099b287"

# Free *.workers.dev URL: https://indexagentica-mcp.indexagentica.workers.dev
workers_dev = true

# --- Custom domain (the indexagentica.com zone is active on Cloudflare) ---
# Wrangler creates the DNS record + certificate for mcp.indexagentica.com.
# Only this hostname is attached; apex/www stay DNS-only for GitHub Pages.
routes = [
  { pattern = "mcp.indexagentica.com", custom_domain = true }
]

[vars]
DATA_BASE_URL = "https://indexagentica.com"
CACHE_TTL_SECONDS = "600"
# Documented limit; must match [ratelimits.simple] below.
RATE_LIMIT_REQUESTS = "120"
RATE_LIMIT_PERIOD_SECONDS = "60"
ALLOWED_ORIGINS = "*"
# Public URL so links in GET / are canonical.
PUBLIC_BASE_URL = "https://mcp.indexagentica.com"

# Workers Rate Limiting binding (per key, per Cloudflare location).
# namespace_id is any positive integer unique within the Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4201"
  [ratelimits.simple]
  limit = 120
  period = 60

# Usage logging (src/analytics.js): one data point per request. Workers Free includes
# 100,000 data points written per day. Environments don't inherit this binding, so
# [env.ratelimit-test] runs without it (logging is a no-op there).
# DISABLED for now: deploy fails with [code: 10089] "You need to enable Analytics Engine"
# until Analytics Engine is enabled once for the account in the Cloudflare dashboard
# (Workers & Pages > Analytics Engine). Uncomment after that and redeploy.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "indexagentica_mcp"

[observability]
enabled = true

# Low-limit environment used only by the automated rate-limit test:
#   npx wrangler dev --env ratelimit-test --port 8788
[env.ratelimit-test]
[env.ratelimit-test.vars]
DATA_BASE_URL = "https://indexagentica.com"
CACHE_TTL_SECONDS = "600"
RATE_LIMIT_REQUESTS = "5"
RATE_LIMIT_PERIOD_SECONDS = "10"
ALLOWED_ORIGINS = "*"
[[env.ratelimit-test.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4299"
  [env.ratelimit-test.ratelimits.simple]
  limit = 5
  period = 10
